<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Agenda do Instagram</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@1&family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap">
<meta name="theme-color" content="#f6f3ec">
<style>
body{margin:0}
img{max-width:100%}
/* Layout: painel de operação. Barra fixa no topo com a luz de conexão de cada conta, contas (perfil + números de 7 dias), depois abas Fila / Calendário / Publicados / Execuções, filtradas por conta; detalhe em painel lateral. Só tema claro, como o site: papel no fundo, marinho e bronze como cores de apoio. */
:root{
  /* Papel & Marinho (perfil_portfolio src/styles/lp-noir.css). */
  --paper:#f6f3ec; --raised:#fbf9f4; --deep:#ece7dc; --ink:#14213d; --text:#1d2433; --muted:#6b675f;
  --line:color-mix(in srgb,#14213d 12%,#f6f3ec); --field:color-mix(in srgb,#14213d 28%,#f6f3ec);
  --bronze:#7a5c2e; --bronze-soft:color-mix(in srgb,#7a5c2e 13%,#fbf9f4);
  --acc-pb:#14213d; --acc-pb-soft:color-mix(in srgb,#14213d 8%,#fbf9f4); --acc-gh:#7a5c2e; --acc-gh-soft:color-mix(in srgb,#7a5c2e 14%,#fbf9f4); --acc-lp:#4f6b5a; --acc-lp-soft:color-mix(in srgb,#4f6b5a 13%,#fbf9f4);
  --signal:#7a5c2e; --signal-ink:#6a4e25; --dot:#7a5c2e;
  --ok:#2f6b4a; --ok-soft:color-mix(in srgb,#2f6b4a 13%,#fbf9f4); --live:#2f9e5b;
  --warn:#8a5a00; --warn-soft:color-mix(in srgb,#8a5a00 12%,#fbf9f4);
  --crit:#b3392b; --crit-soft:color-mix(in srgb,#b3392b 11%,#fbf9f4);
  --f-body:Roboto, system-ui, -apple-system, "Segoe UI", sans-serif; --f-mono:"Roboto Mono", ui-monospace, Menlo, monospace;
  --f-accent:"Instrument Serif", Georgia, "Times New Roman", serif;
  --r-field:8px; --r-card:10px; --r-panel:12px;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{padding-bottom:env(safe-area-inset-bottom,0px);background:var(--paper)}
body{background:var(--paper);color:var(--text);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
a{color:inherit;text-underline-offset:3px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1200px;margin:0 auto;padding-block:20px 48px;display:flex;flex-direction:column;gap:20px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

/* Barra do topo, sempre visível */
.top{position:sticky;top:0;z-index:15;background:color-mix(in srgb,var(--paper) 88%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top-in{max-width:1200px;margin:0 auto;padding-block:10px;display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}.brand svg{width:34px;height:34px;flex:none}
h1{font-weight:500;font-size:1.2rem;letter-spacing:-.01em;margin:0;white-space:nowrap;color:var(--ink)}
h1 em{font-family:var(--f-accent);font-style:italic;font-weight:400;color:var(--signal-ink);letter-spacing:0;font-size:1.12em}
.conns{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.conn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--raised);border-radius:var(--r-field);padding:4px 10px 4px 4px;font-size:.8rem;cursor:pointer;min-width:0}
.conn img,.conn .av0{width:26px;height:26px;border-radius:50%;object-fit:cover;flex:none;background:var(--deep)}
.conn .c-txt{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.conn .c-txt b{font-weight:500;white-space:nowrap}
.conn .c-txt span{font-size:.7rem;color:var(--muted);white-space:nowrap}
.conn.on{border-color:color-mix(in srgb,var(--live) 35%,var(--line))}
.conn.off{border-color:color-mix(in srgb,var(--crit) 55%,var(--line));background:var(--crit-soft)}
.conn.off .c-txt span{color:var(--crit)}
.lamp{width:10px;height:10px;border-radius:50%;flex:none;background:var(--muted);box-shadow:0 0 0 3px color-mix(in srgb,var(--muted) 18%,transparent)}
.lamp.on{background:var(--live);box-shadow:0 0 0 3px color-mix(in srgb,var(--live) 22%,transparent)}
.lamp.off{background:var(--crit);box-shadow:0 0 0 3px color-mix(in srgb,var(--crit) 22%,transparent)}
.lamp.velho{background:var(--warn);box-shadow:0 0 0 3px color-mix(in srgb,var(--warn) 22%,transparent)}
@media (prefers-reduced-motion:no-preference){.lamp.on{animation:pulso 2.6s ease-in-out infinite}.lamp.off{animation:pulso 1.2s ease-in-out infinite}}
@keyframes pulso{50%{box-shadow:0 0 0 6px transparent}}
.top-act{display:flex;gap:8px;align-items:center}

.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:8px 20px}
.head p{margin:0;font-size:.9rem;color:var(--muted)}
.sync{font-size:.8rem;color:var(--muted)}
.btn{border:1px solid var(--field);background:var(--raised);border-radius:var(--r-field);padding:7px 12px;cursor:pointer;font-size:.85rem;font-weight:500;white-space:nowrap;color:var(--ink)}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.btn:disabled{opacity:.55;cursor:default}
.btn.small{padding:4px 9px;font-size:.78rem}

.accounts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:14px}
.acct{background:var(--raised);border:1px solid var(--line);border-radius:var(--r-panel);padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0;box-shadow:inset 0 3px 0 var(--c)}
[data-a="pontes_brain"]{--c:var(--acc-pb);--soft:var(--acc-pb-soft)}
[data-a="GiraHub"]{--c:var(--acc-gh);--soft:var(--acc-gh-soft)}
[data-a="leopontesrp"]{--c:var(--acc-lp);--soft:var(--acc-lp-soft)}
.who{display:flex;gap:12px;align-items:center;min-width:0}
.avatar{width:52px;height:52px;border-radius:50%;object-fit:cover;flex:none;background:var(--soft);border:2px solid var(--raised);box-shadow:0 0 0 1.5px var(--c)}
.who-txt{min-width:0;display:flex;flex-direction:column;gap:1px}
.who-name{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.who-user{font-size:.85rem;color:var(--muted)}
.who-user a{color:var(--ink);font-weight:500}
.status{margin-left:auto;align-self:flex-start;display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-size:.74rem;color:var(--muted);text-align:right}
.status b{display:inline-flex;align-items:center;gap:7px;font-weight:500;font-size:.8rem;color:var(--ok)}
.status b.off{color:var(--crit)}.status b.velho{color:var(--warn)}
.conn-err{font-size:.82rem;color:var(--crit);background:var(--crit-soft);border-radius:var(--r-field);padding:8px 10px;margin:0}
.figs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 14px;margin:0}
.fig{display:flex;flex-direction:column;gap:2px;min-width:0}
.fig dt{font-size:.72rem;color:var(--muted);order:2}
.fig dd{margin:0;font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:1.25rem;font-weight:500;order:1;color:var(--ink);display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.figs-cap{font-size:.72rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin:0 0 -6px}
.acct-lines{display:flex;flex-direction:column;gap:4px;font-size:.85rem;border-top:1px solid var(--line);padding-top:10px}
.acct-lines div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acct-lines b{font-weight:500}
.alert{color:var(--crit);font-weight:500}
.spark{display:block;width:100%;height:34px}

/* Variação: verde sobe, vermelho cai, cinza fica na média */
.dlt{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:.72rem;font-weight:500;border-radius:5px;padding:1px 5px;white-space:nowrap;line-height:1.4}
.dlt.up{color:var(--ok);background:var(--ok-soft)}
.dlt.down{color:var(--crit);background:var(--crit-soft)}
.dlt.flat{color:var(--muted);background:var(--deep)}
.verd{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:500;letter-spacing:.02em;border-radius:6px;padding:2px 8px;white-space:nowrap}
.verd.up{color:var(--paper);background:var(--ok)}
.verd.down{color:var(--paper);background:var(--crit)}
.verd.flat{color:var(--ink);background:var(--deep)}
.verd.cedo{color:var(--muted);border:1px dashed var(--field)}

.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-field);background:var(--raised);max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg button{border:0;background:transparent;padding:8px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;font-size:.85rem;white-space:nowrap;color:var(--muted);box-shadow:inset 0 -2px 0 transparent}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--bronze-soft);color:var(--ink);font-weight:500;box-shadow:inset 0 -2px 0 var(--bronze)}
.seg img{width:20px;height:20px;border-radius:50%;object-fit:cover}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.dot.pb{background:var(--acc-pb)}.dot.gh{background:var(--acc-gh)}.dot.lp{background:var(--acc-lp)}

.pill{display:inline-block;font-size:.68rem;letter-spacing:.05em;text-transform:uppercase;border-radius:6px;padding:2px 7px;border:1px solid var(--line);white-space:nowrap;font-weight:500}
.pill.publicado{color:var(--ok);border-color:currentColor}
.pill.agendado{color:var(--ink)}
.pill.manual,.pill.pendente,.pill.atrasado{color:var(--warn);border-color:currentColor}
.pill.manual{border-style:dashed}
.pill.falhou{color:var(--crit);border-color:currentColor}

.section-note{font-size:.82rem;color:var(--muted);margin:0}
.empty{padding:36px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r-panel)}

/* Foto do post com o avatar da conta no canto */
.ph-wrap{position:relative;display:block;flex:none;width:var(--s,56px);height:var(--s,56px)}
.ph-wrap .thumb{width:100%;height:100%;border-radius:8px;object-fit:cover;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:.6rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;border:1px solid var(--line)}
.ph-wrap .mini{position:absolute;right:-5px;bottom:-5px;width:calc(var(--s,56px)*.42);height:calc(var(--s,56px)*.42);min-width:16px;min-height:16px;border-radius:50%;object-fit:cover;border:2px solid var(--raised);background:var(--c);box-shadow:0 0 0 1px var(--c)}
.tbl-acc{display:flex;align-items:center;gap:7px;white-space:nowrap}
.tbl-acc img{width:22px;height:22px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 1.5px var(--c)}

/* Fila */
.queue{display:flex;flex-direction:column;gap:18px}
.qday h3{font-size:.76rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:0 0 6px;font-weight:500}
.qitems{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r-panel);background:var(--raised);overflow:hidden}
.qrow{display:grid;grid-template-columns:auto 48px minmax(0,1fr) auto;gap:14px;align-items:center;padding:10px 14px 10px 12px;border-left:3px solid var(--c)}
.qrow+.qrow{border-top:1px solid var(--line)}
.qtime{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:.9rem;color:var(--ink)}
.qmain{min-width:0;display:flex;flex-direction:column;gap:3px;text-align:left;background:none;border:0;padding:0;cursor:pointer}
.qtitle{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500;color:var(--ink)}
.qmeta{font-size:.78rem;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.qact{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}

/* Calendário */
.month{display:flex;align-items:center;gap:8px}
.month h2{margin:0;font-weight:500;font-size:1.05rem;min-width:9em;text-align:center;text-transform:capitalize;color:var(--ink)}
.navb{border:1px solid var(--line);background:var(--raised);border-radius:var(--r-field);width:36px;height:36px;cursor:pointer;color:var(--ink)}
.cal{border:1px solid var(--line);border-radius:var(--r-panel);overflow:hidden;background:var(--raised)}
.dow,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.dow div{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line)}
.day{min-height:120px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;display:flex;flex-direction:column;gap:4px;min-width:0}
.day:nth-child(7n){border-right:0}
.day.out{background:var(--deep)}
.day.out .dn{opacity:.45}
.dn{font-family:var(--f-mono);font-size:.74rem;color:var(--muted);display:flex;justify-content:space-between}
.day.today{background:var(--bronze-soft)}
.day.today .dn b{background:var(--bronze);color:var(--paper);border-radius:6px;padding:0 6px}
.ev{text-align:left;font-size:.72rem;line-height:1.25;border-radius:7px;padding:3px;cursor:pointer;display:flex;gap:6px;align-items:center;min-width:0;width:100%;background:var(--raised);border:1px solid var(--line);border-left:3px solid var(--c)}
.ev .ph-wrap{--s:28px}
.ev .ph-wrap .thumb{border-radius:5px}
.ev .ph-wrap .mini{border-width:1.5px;right:-4px;bottom:-4px}
.ev .ev-txt{display:flex;flex-direction:column;min-width:0;gap:1px}
.ev .t{font-family:var(--f-mono);font-variant-numeric:tabular-nums;flex:none;color:var(--ink);display:flex;gap:4px;align-items:center}
.ev .ttl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;color:var(--muted)}
.ev.publicado{background:var(--soft)}
.ev.publicado .t::after{content:"✓";color:var(--ok);font-weight:700}
.ev.manual,.ev.pendente{border-style:dashed;border-left-style:solid}
.ev.falhou,.ev.atrasado{border-color:var(--crit);background:var(--crit-soft)}
.ev .arrow{font-size:.7rem;font-weight:700}
.ev .arrow.up{color:var(--ok)}.ev .arrow.down{color:var(--crit)}
.more{font-size:.7rem;color:var(--muted);padding-left:4px;background:none;border:0;cursor:pointer;text-align:left}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.76rem;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.lg-ag{border:1.5px solid var(--muted)}.lg-pub{background:var(--muted)}.lg-man{border:1.5px dashed var(--muted)}.lg-err{border:1.5px solid var(--crit)}

/* Publicados */
.score{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.score div{background:var(--raised);border:1px solid var(--line);border-radius:var(--r-card);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.score dd{margin:0;font-family:var(--f-mono);font-size:1.5rem;font-weight:500}
.score dt{font-size:.78rem;color:var(--muted)}
.score .s-up dd{color:var(--ok)}.score .s-down dd{color:var(--crit)}.score .s-flat dd{color:var(--ink)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-panel);background:var(--raised)}
table{border-collapse:collapse;width:100%;font-size:.84rem}
th,td{padding:8px 10px;text-align:left;vertical-align:middle;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
th{font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500;white-space:nowrap;background:var(--raised);position:sticky;top:0}
th button{background:none;border:0;padding:0;cursor:pointer;letter-spacing:inherit;text-transform:inherit;color:inherit;font-weight:inherit;font-size:inherit}
th button[aria-sort]::after{content:" ↓"}
th button[aria-sort="ascending"]::after{content:" ↑"}
td.n,th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
td.n{color:var(--ink)}
td.n .dlt{display:block;width:max-content;margin:2px 0 0 auto}
td.n.up{background:color-mix(in srgb,var(--ok) 7%,transparent)}
td.n.down{background:color-mix(in srgb,var(--crit) 6%,transparent)}
th.n button{text-align:right}
td.cap{min-width:220px;max-width:340px}
td.cap .qmain span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--ink)}
.sub-h{font-size:.95rem;font-weight:500;margin:6px 0 -6px;color:var(--ink)}
.stack{display:flex;flex-direction:column;gap:14px}
.sortbar{display:none;align-items:center;gap:8px;font-size:.85rem;color:var(--muted)}
.sortbar select{font:inherit;color:var(--ink);background:var(--raised);border:1px solid var(--field);border-radius:var(--r-field);padding:6px 8px}
.pcards{display:none;flex-direction:column;gap:10px}
.pcard{background:var(--raised);border:1px solid var(--line);border-radius:var(--r-panel);padding:12px;display:flex;flex-direction:column;gap:10px;border-left:3px solid var(--c)}
.pcard.up{border-left-color:var(--ok)}.pcard.down{border-left-color:var(--crit)}
.pc-top{display:flex;gap:12px;align-items:flex-start;min-width:0}
.pc-top .qmain{flex:1}
.pc-top .qtitle{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.pc-m{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:0}
.pc-m div{display:flex;flex-direction:column;gap:2px;padding:7px 8px;border-radius:8px;background:var(--paper);min-width:0}
.pc-m div.up{background:var(--ok-soft)}.pc-m div.down{background:var(--crit-soft)}
.pc-m dt{font-size:.68rem;color:var(--muted);order:3}
.pc-m dd{margin:0;font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:1rem;font-weight:500;color:var(--ink)}
.pc-m .dlt{background:none;padding:0;font-size:.7rem}

/* Detalhe */
.panel{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 28%,transparent);display:flex;justify-content:flex-end;z-index:20}
.sheet{background:var(--raised);width:min(500px,100%);height:100%;overflow:auto;padding:calc(20px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;border-left:1px solid var(--line);box-shadow:-12px 0 40px color-mix(in srgb,var(--ink) 12%,transparent)}
.sheet-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sheet h2{margin:0;font-weight:500;font-size:1.1rem;text-wrap:balance;color:var(--ink)}
.meta{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.85rem;margin:0}
.meta dt{color:var(--muted)}.meta dd{margin:0;min-width:0;overflow-wrap:anywhere}
/* Carrossel do detalhe: desliza com o dedo, setas no computador, pontos e contador */
.gal{position:relative;display:flex;flex-direction:column;gap:8px}
.gal-track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;border-radius:var(--r-card);border:1px solid var(--line);background:var(--deep);scrollbar-width:none;overscroll-behavior-x:contain}
.gal-track::-webkit-scrollbar{display:none}
.gal-item{flex:0 0 100%;scroll-snap-align:center;margin:0;display:flex;align-items:center;justify-content:center;aspect-ratio:4/5;max-height:70vh}
.gal-item img,.gal-item video{width:100%;height:100%;object-fit:contain;display:block}
.gal-foot{display:flex;align-items:center;justify-content:center;gap:12px}
.gal-count{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);min-width:3em}
.gal-nav{position:absolute;top:calc(50% - 22px);width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:color-mix(in srgb,var(--raised) 92%,transparent);color:var(--ink);font-size:1.2rem;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px color-mix(in srgb,var(--ink) 15%,transparent)}
.gal-nav.prev{left:8px}.gal-nav.next{right:8px}

.h4{font-size:.92rem;font-weight:500;margin:4px 0 0;color:var(--ink)}

.chips button{border:1px solid var(--line);background:transparent;border-radius:var(--r-field);padding:6px 10px;cursor:pointer;font-size:.8rem;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--bronze-soft);color:var(--ink);border-color:var(--bronze);font-weight:500}

<body>

<div class="wrap login gut" id="login" hidden>
  <div class="brand"><svg viewBox="0 0 512 512" role="img" aria-label="LP"><g transform="translate(-16 0)"><g fill="none" stroke="var(--ink)" stroke-width="44" stroke-linejoin="miter"><path d="M178 118V372H300"/><path d="M178 140H290A72 72 0 0 1 290 284H222"/></g><circle cx="362" cy="372" r="26" fill="var(--dot)"/></g></svg><h1>Agenda do <em>Instagram</em></h1></div>

</div>

<div id="app" hidden>
  <header class="top gut">
    <div class="top-in">
      <div class="brand"><svg viewBox="0 0 512 512" role="img" aria-label="LP"><g transform="translate(-16 0)"><g fill="none" stroke="var(--ink)" stroke-width="44" stroke-linejoin="miter"><path d="M178 118V372H300"/><path d="M178 140H290A72 72 0 0 1 290 284H222"/></g><circle cx="362" cy="372" r="26" fill="var(--dot)"/></g></svg><h1>Agenda do <em>Instagram</em></h1></div>
      <div class="conns" id="conns" aria-label="Conexão das contas com o Instagram"></div>
      <div class="top-act"><button class="btn" id="b-refresh" type="button">Atualizar</button><button class="btn" id="b-sair" type="button">Sair</button></div>
    </div>
  </header>
  <main class="wrap gut">
    <div class="head">
      <p>O que está na fila, o que já saiu e como cada post foi perto dos anteriores.</p>
      <div><span class="sync" id="sync">Carregando…</span> <span id="req" class="msg"></span></div>
    </div>

    <div class="accounts" id="accounts"></div>

    <div class="toolbar">
      <div class="seg" role="group" aria-label="Conta" id="f-acc">
        <button type="button" id="fa-all" data-v="all" aria-pressed="true">Todas</button>
        <button type="button" id="fa-pb" data-v="pontes_brain" aria-pressed="false"><span class="dot pb"></span>@pontes_brain</button>
        <button type="button" id="fa-gh" data-v="GiraHub" aria-pressed="false"><span class="dot gh"></span>@girahuboficial</button>
        <button type="button" id="fa-lp" data-v="leopontesrp" aria-pressed="false"><span class="dot lp"></span>@leopontesrp</button>
      </div>
      <div class="seg" role="group" aria-label="Visão" id="f-view">
        <button type="button" id="fv-fila" data-v="fila" aria-pressed="true">Fila</button>
        <button type="button" id="fv-cal" data-v="calendario" aria-pressed="false">Calendário</button>
        <button type="button" id="fv-pub" data-v="publicados" aria-pressed="false">Publicados</button>
        <button type="button" id="fv-exe" data-v="execucoes" aria-pressed="false">Execuções</button>

    <div id="view"></div>

</div>

<div class="panel" id="panel" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="d-title">
    <div class="sheet-top">
      <div style="display:flex;flex-direction:column;gap:6px;min-width:0">
        <span id="d-pill"></span>
        <h2 id="d-title"></h2>
      </div>
      <button class="btn" id="d-close" type="button">Fechar</button>
    </div>
    <div id="d-body" style="display:flex;flex-direction:column;gap:14px"></div>
  </div>
</div>

<script>
const ACC = {
  pontes_brain:{label:"@pontes_brain", user:"pontes_brain", cls:"pb"},
  GiraHub:{label:"@girahuboficial", user:"girahuboficial", cls:"gh"},
  leopontesrp:{label:"@leopontesrp", user:"leopontesrp", cls:"lp"}
};
const FMT = {post:"Post", carrossel:"Carrossel", story:"Story", "story-video":"Story vídeo", reel:"Reel"};
const IGFMT = {IMAGE:"Post", CAROUSEL_ALBUM:"Carrossel", VIDEO:"Vídeo", REELS:"Reel"};
const STATUS = {agendado:"Agendado", publicado:"Publicado", manual:"Postar à mão", pendente:"Não postado", falhou:"Falhou", atrasado:"Atrasado"};
const MONTHS = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const DOW = ["Seg","Ter","Qua","Qui","Sex","Sáb","Dom"];
const TZ = "America/Sao_Paulo";

let D = {agenda:null, met:{}, img:{}, gal:{}, runs:null, lidoEm:null, manuais:{}};
let S = {acc:"all", view:"fila", y:0, m:0, sort:{k:"quando", dir:-1}};
let confirmId = null, actMsg = {};

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const nf = new Intl.NumberFormat("pt-BR");
const n = v => v==null ? "–" : nf.format(v);
const pct = (a,b) => (a==null||!b) ? "–" : (100*a/b).toLocaleString("pt-BR",{maximumFractionDigits:1})+"%";
const dayKey = d => new Intl.DateTimeFormat("en-CA",{timeZone:TZ}).format(new Date(d));
const hm = d => new Intl.DateTimeFormat("pt-BR",{timeZone:TZ,hour:"2-digit",minute:"2-digit"}).format(new Date(d));
const ddmm = d => new Intl.DateTimeFormat("pt-BR",{timeZone:TZ,day:"2-digit",month:"2-digit"}).format(new Date(d));
const ddmmhm = d => `${ddmm(d)} ${hm(d)}`;
const todayStr = dayKey(Date.now());
{ const [y,m] = todayStr.split("-").map(Number); S.y=y; S.m=m-1; }
try { const s = JSON.parse(localStorage.getItem("agenda-ig2")||"{}"); if (s.acc) S.acc=s.acc; } catch(e) {}
function save(){ try{ localStorage.setItem("agenda-ig2", JSON.stringify({acc:S.acc})); }catch(e){} }
const VIEWS = ["fila","calendario","publicados","execucoes"];
function fromHash(){ const h = location.hash.slice(1); if (VIEWS.includes(h)) S.view = h; }
fromHash();

/* ---------- modelo ---------- */
function igPosts(conta){ return D.met[conta]?.posts || []; }
function igStories(conta){ return D.met[conta]?.stories || []; }
function igById(id){ for (const c of Object.keys(ACC)) { const p = igPosts(c).find(x=>x.id===id) || igStories(c).find(x=>x.id===id); if (p) return p; } return null; }
function detectedStory(p){
  if (!(p.formato||"").startsWith("story")) return null;
  return igStories(p.conta).filter(s => dayKey(s.quando)===dayKey(p.quando)).sort((a,b)=>a.quando.localeCompare(b.quando))[0] || null;
}
function effStatus(p){
  if (p.status==="publicado") return "publicado";
  if (p.status==="falhou") return "falhou";
  if (p.status==="manual"){
    if (D.manuais[p.id] || detectedStory(p)) return "publicado";
    return dayKey(p.quando) < todayStr ? "pendente" : "manual";
  }
  if (p.status==="agendado" && Date.now() - new Date(p.quando) > 20*60000) return "atrasado";
  return p.status;
}
function rows(){
  const ag = D.agenda?.posts || [];
  const out = ag.map(p => ({...p, eff:effStatus(p), kind:"agenda"}));
  const known = new Set(ag.map(p=>p.midiaId).filter(Boolean));
  for (const c of Object.keys(ACC)) for (const m of igPosts(c)) {
    if (known.has(m.id)) continue;
    out.push({id:"ig:"+m.id, conta:c, quando:m.quando, formato:m.produto==="REELS"?"reel":(m.tipo==="CAROUSEL_ALBUM"?"carrossel":"post"),
      status:"publicado", eff:"publicado", titulo:(m.legenda||"").split("\n")[0].slice(0,90) || "Post sem legenda", legenda:m.legenda, link:m.link, midiaId:m.id, kind:"ig"});
  }
  return out.filter(r => S.acc==="all" || r.conta===S.acc);
}
function thumbOf(r){
  const det = r.kind==="agenda" ? detectedStory(r) : null;
  return D.img[r.id] || (r.midiaId && D.img["ig:"+r.midiaId]) || (det && D.img["ig:"+det.id]) || null;
}
/** Foto do post com o avatar da conta no canto, como no feed. */
function photoHtml(conta, url, label, size){
  const av = D.img["perfil:"+conta];
  return `<span class="ph-wrap"${size?` style="--s:${size}px"`:""}>${url?`<img class="thumb" src="${esc(url)}" alt="" loading="lazy">`:`<span class="thumb">${esc(label||"")}</span>`}${av?`<img class="mini" src="${esc(av)}" alt="${esc(ACC[conta]?.label||"")}" loading="lazy">`:`<span class="mini" aria-hidden="true"></span>`}</span>`;
}

/* ---------- conexão ---------- */
// A coleta de métricas (de hora em hora) chama /me com o token de cada conta e grava se ele valeu.
function conexao(k){
  const c = D.met[k]?.conexao;
  if (!c?.verificadoEm) return {cls:"", lamp:"", txt:"Sem checagem", sub:"", det:"A primeira checagem do token chega com a próxima coleta de números."};
  const sub = dayKey(c.verificadoEm)===todayStr ? hm(c.verificadoEm) : ddmmhm(c.verificadoEm);
  if (!c.ok && c.tipo!=="api") return {cls:"off", lamp:"off", txt:"Desconectado", sub, det:`O Instagram recusou o token desta conta (${c.erro||"sem detalhe"}). Nada desta conta é publicado até o token ser renovado.`};
  if (!c.ok) return {cls:"velho", lamp:"velho", txt:"Instagram não respondeu", sub, det:`O token não foi recusado, mas a última chamada à API falhou: ${c.erro||"sem detalhe"}.`};
  if (Date.now() - new Date(c.verificadoEm) > 3*3600000) return {cls:"velho", lamp:"velho", txt:"Sem checagem recente", sub, det:"A coleta de hora em hora não rodou nas últimas 3 horas. Toque em Atualizar para checar agora."};
  return {cls:"on", lamp:"on", txt:"Conectado", sub, det:`Token aceito pelo Instagram na checagem das ${hm(c.verificadoEm)}.`};
}
function renderConns(){
  $("conns").innerHTML = Object.entries(ACC).map(([k,a])=>{
    const c = conexao(k), ph = D.img["perfil:"+k];
    return `<button type="button" class="conn ${c.cls}" data-conn="${k}" data-a="${k}" title="${esc(c.det)}" aria-label="${esc(a.label)}: ${esc(c.txt)}${c.sub?", checado "+esc(c.sub):""}">
      ${ph?`<img src="${esc(ph)}" alt="">`:`<span class="av0"></span>`}<span class="lamp ${c.lamp}" aria-hidden="true"></span>
      <span class="c-txt"><b>${esc(a.label)}</b><span>${esc(c.txt)}${c.sub?" · "+esc(c.sub):""}</span></span></button>`;
  }).join("");
}

/* ---------- comparação com os posts anteriores ---------- */
const HORA = 3600000, DIA = 86400000;
const CMPK = [["views","Visualizações","Views"],["reach","Alcance","Alcance"],["total_interactions","Interações","Interações"],["curtidas","Curtidas","Curtidas"],["saved","Salvamentos","Salvos"],["shares","Compartilhamentos","Compart."],["comentarios","Comentários","Coment."]];
const STK = [["views","Visualizações"],["reach","Alcance"],["replies","Respostas"],["shares","Compartilhamentos"],["total_interactions","Interações"]];
const lvl = d => d >= .15 ? "up" : d <= -.15 ? "down" : "flat";
// Com números pequenos, 1 curtida a mais não é tendência: diferença menor que 2 conta como na média.
const lvlM = m => Math.abs(m.v - m.base) < 2 ? "flat" : lvl(m.d);
const pctAbs = d => { const v = Math.round(Math.abs(d)*100); return v > 999 ? ">999%" : v+"%"; };
function dlt(c){
  if (!c) return "";
  const l = lvlM(c);
  const t = l==="up" ? "▲ "+pctAbs(c.d) : l==="down" ? "▼ "+pctAbs(c.d) : Math.abs(c.v-c.base) < 2 ? "= média" : "≈ "+(c.d>=0?"+":"−")+pctAbs(c.d);
  return `<span class="dlt ${l}" title="Média: ${n(Math.round(c.base))}">${t}</span>`;
}
function verdHtml(c){
  if (!c || c.lvl==="cedo") return `<span class="verd cedo">${c && c.age < HORA ? "Cedo para comparar" : "Sem base para comparar"}</span>`;
  if (c.lvl==="up") return `<span class="verd up">▲ ${pctAbs(c.d)} acima da média</span>`;
  if (c.lvl==="down") return `<span class="verd down">▼ ${pctAbs(c.d)} abaixo da média</span>`;
  return `<span class="verd flat">= Na média</span>`;
}
const idadeTxt = a => a >= 7*DIA ? "números finais" : a < 48*HORA ? `com ${Math.max(1,Math.round(a/HORA))} h de vida` : `com ${Math.round(a/DIA)} dias de vida`;
/** Valor de um post anterior quando ele tinha a mesma idade, pela série de coletas. */
function atAge(q, k, age){
  const t0 = new Date(q.quando).getTime();
  if (Date.now() - t0 < age) return null;
  const cur = val(q,k);
  if (age >= 7*DIA) return cur;
  const pts = seriesOf(q,k).filter(x=>!x.origem).map(x=>({a:x.t-t0, v:x.v}));
  let lo = null, hi = null;
  for (const p of pts){ if (p.a <= age) lo = p; else if (!hi) hi = p; }
  if (lo && hi) return lo.v + (hi.v-lo.v)*(age-lo.a)/((hi.a-lo.a)||1);
  if (!lo && hi && hi.a <= Math.max(2*age, age+3*HORA)) return hi.v*age/hi.a;
  if (lo && !hi && age - lo.a < 6*HORA) return lo.v;
  return age >= 3*DIA ? cur : null;
}
const CMP = new Map();
function fechar(out, keys){
  const main = keys.map(k=>out.m[k]).filter(Boolean).map(m=>lvlM(m)==="flat" && Math.abs(m.v-m.base) < 2 ? 0 : m.d);
  out.d = main.length ? main.reduce((s,x)=>s+x,0)/main.length : null;
  out.lvl = out.d==null ? "cedo" : lvl(out.d);
  return out;
}
/** Cada número do post contra a média dos 5 posts anteriores da conta, na mesma idade. */
function compare(p, conta){
  const key = conta+"|"+p.id; if (CMP.has(key)) return CMP.get(key);
  const t = new Date(p.quando).getTime(), age = Date.now() - t;
  const prev = igPosts(conta).filter(q=>q.id!==p.id && new Date(q.quando).getTime() < t).sort((a,b)=>b.quando.localeCompare(a.quando)).slice(0,5);
  const out = {age, n:prev.length, m:{}};
  if (age >= HORA) for (const [k] of CMPK){
    const v = val(p,k); if (v==null) continue;
    const vals = prev.map(q=>atAge(q,k,age)).filter(x=>x!=null);
    if (!vals.length) continue;
    const base = vals.reduce((s,x)=>s+x,0)/vals.length;
    out.m[k] = {v, base, d: base>0 ? (v-base)/base : (v>0 ? 1 : 0), n:vals.length};
  }
  CMP.set(key, fechar(out, ["views","reach","total_interactions"])); return out;
}
/** Story contra os 5 stories anteriores da conta (stories duram 24 h, então são números finais). */
function compareStory(s, conta){
  const key = conta+"|s|"+s.id; if (CMP.has(key)) return CMP.get(key);
  const t = new Date(s.quando).getTime();
  const prev = igStories(conta).filter(q=>q.id!==s.id && new Date(q.quando).getTime() < t).sort((a,b)=>b.quando.localeCompare(a.quando)).slice(0,5);
  const out = {age:Date.now()-t, n:prev.length, m:{}, story:true};
  for (const [k] of STK){
    const v = s.insights?.[k]; if (v==null) continue;
    const vals = prev.map(q=>q.insights?.[k]).filter(x=>x!=null);
    if (!vals.length) continue;
    const base = vals.reduce((a,x)=>a+x,0)/vals.length;
    out.m[k] = {v, base, d: base>0 ? (v-base)/base : (v>0 ? 1 : 0), n:vals.length};
  }
  CMP.set(key, fechar(out, ["views","reach"])); return out;
}
function cmpOfRow(r){
  const det = r.kind==="agenda" ? detectedStory(r) : null;
  const ig = (r.midiaId ? igById(r.midiaId) : null) || det;
  if (!ig) return null;
  return ig.produto==="STORY" ? compareStory(ig, r.conta) : compare(ig, r.conta);
}
function canPublish(r){ return r.kind==="agenda" && (r.status==="agendado" || r.status==="falhou") && D.agenda?.contas?.[r.conta]?.publicador==="proprio"; }
function canMark(r){ return r.kind==="agenda" && r.status==="manual" && r.eff!=="publicado"; }

function spark(hist){
  const pts = hist.filter(h=>h.seguidores!=null);
  if (pts.length < 3) return "";
  const vals = pts.map(h=>h.seguidores), lo = Math.min(...vals), hi = Math.max(...vals), span = hi-lo || 1;
  const W=300, H=34, P=3;
  const xy = vals.map((v,i)=>[P + i*(W-2*P)/(vals.length-1), H-P - (v-lo)*(H-2*P)/span]);
  const line = xy.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const last = xy[xy.length-1];
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Seguidores de ${esc(pts[0].data)} a ${esc(pts[pts.length-1].data)}: ${vals[0]} para ${vals[vals.length-1]}">
    <path d="${line} L${last[0]} ${H} L${xy[0][0]} ${H} Z" fill="var(--soft)" stroke="none"/>
    <path d="${line}" fill="none" stroke="var(--c)" stroke-width="1.5" vector-effect="non-scaling-stroke"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="2.5" fill="var(--c)"/></svg>`;
}
function reachChart(k, m){
  const d = Array.isArray(m.diario?.reach) ? m.diario.reach.filter(x=>x.dia) : [];
  if (d.length < 2) return "";
  const pts = d.map(x=>({t:new Date(x.dia+"T12:00:00Z").getTime(), v:x.valor||0}));
  return `<div><p class="section-note" style="margin-bottom:2px">Contas alcançadas por dia, últimos ${d.length} dias</p>${lineChart("ch-acc-"+k, pts, "dia", 150)}</div>`;
}

/* ---------- calendário ---------- */
function renderCal(){
  const y=S.y, m=S.m;
  const first = new Date(Date.UTC(y,m,1));
  const lead = (first.getUTCDay()+6)%7;
  const days = new Date(Date.UTC(y,m+1,0)).getUTCDate();
  const total = Math.ceil((lead+days)/7)*7;
  const byDay = {};
  rows().forEach(r=>{ (byDay[dayKey(r.quando)] ||= []).push(r); });
  Object.values(byDay).forEach(a=>a.sort((p,q)=>p.quando.localeCompare(q.quando)));
  let cells = "";
  for (let i=0;i<total;i++){
    const d = new Date(Date.UTC(y,m,1+i-lead));
    const ds = d.toISOString().slice(0,10);
    const inM = d.getUTCMonth()===m;
    const evs = byDay[ds]||[];
    const shown = evs.slice(0,5);
    cells += `<div class="day${inM?"":" out"}${ds===todayStr?" today":""}${inM&&!evs.length?" blank":""}">
      <div class="dn"><b>${d.getUTCDate()}</b><span>${inM&&evs.length?DOW[(d.getUTCDay()+6)%7]:""}</span></div>
      ${shown.map(r=>{ const c = r.eff==="publicado" ? cmpOfRow(r) : null; const ar = c && (c.lvl==="up"||c.lvl==="down") ? `<span class="arrow ${c.lvl}" aria-label="${c.lvl==="up"?"acima":"abaixo"} da média">${c.lvl==="up"?"▲":"▼"}</span>` : "";
        return `<button type="button" class="ev ${r.eff}" data-a="${esc(r.conta)}" data-id="${esc(r.id)}" title="${esc(r.titulo)}">${photoHtml(r.conta, thumbOf(r), "")}<span class="ev-txt"><span class="t">${hm(r.quando)}${ar}</span><span class="ttl">${esc(FMT[r.formato]||r.formato)} · ${esc(r.titulo)}</span></span></button>`; }).join("")}
      ${evs.length>5?`<button type="button" class="more" data-day="${ds}">+${evs.length-5} no dia</button>`:""}
    </div>`;
  }
  $("view").className = "stack";
  $("view").innerHTML = `
    <div class="toolbar"><div class="month"><button type="button" class="navb" id="prev" aria-label="Mês anterior">‹</button><h2>${MONTHS[m]} ${y}</h2><button type="button" class="navb" id="next" aria-label="Próximo mês">›</button></div>
    <div class="legend"><span><i class="lg-ag"></i>Agendado</span><span><i class="lg-pub"></i>Publicado</span><span><i class="lg-man"></i>Story à mão</span><span><i class="lg-err"></i>Falha ou atraso</span><span><b style="color:var(--ok)">▲</b> <b style="color:var(--crit)">▼</b> acima ou abaixo da média</span></div></div>
    <div class="cal cal-view"><div class="dow">${DOW.map(d=>`<div>${d}</div>`).join("")}</div><div class="grid">${cells}</div></div>`;
}

/* ---------- execuções ---------- */

const SER = {t:0, views:1, reach:2, curtidas:3, total_interactions:4, saved:5, shares:6, comentarios:7};
const SMETRICS = [["views","Visualizações"],["reach","Alcance"],["curtidas","Curtidas"],["total_interactions","Interações"]];
const MES = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
const dLabel = t => { const k = dayKey(t); return `${+k.slice(8,10)} de ${MES[+k.slice(5,7)-1]}`; };
/** Pontos de uma métrica do post, começando em zero na hora da publicação (como no app). */
function seriesOf(p, k){
  const pts = (p.serie||[]).map(a=>({t:new Date(a[0]).getTime(), v:a[SER[k]]})).filter(x=>x.v!=null);
  const t0 = new Date(p.quando).getTime();
  if (!pts.length || pts[0].t > t0) pts.unshift({t:t0, v:0, origem:true});
  return pts;
}
function niceMax(v){ if (v<=4) return 4; const e = 10**Math.floor(Math.log10(v)); for (const m of [1,2,2.5,5,10]) if (m*e >= v) return m*e; return 10*e; }
const CHARTS = {};
function lineChart(id, pts, fmtT, H=210){
  const W=440, L=38, R=10, T=40, B=24;
  CHARTS[id] = {pts, W, H, L, R, T, B, fmtT};
  if (pts.length < 2) return `<p class="section-note">A linha aparece depois da primeira coleta.</p>`;
  const t0=pts[0].t, t1=pts[pts.length-1].t, span=(t1-t0)||1;
  const ymax = niceMax(Math.max(...pts.map(p=>p.v)));
  const x = t => L + (t-t0)*(W-L-R)/span, y = v => H-B - v*(H-T-B)/ymax;
  const d = pts.map((p,i)=>(i?"L":"M")+x(p.t).toFixed(1)+" "+y(p.v).toFixed(1)).join(" ");
  const yt = [0, ymax/2, ymax];
  const xt = [t0, t0+span/2, t1];
  CHARTS[id].x = x; CHARTS[id].y = y;
  return `<div class="chart" id="${id}">
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(fmtT==="hora"?"":"")}Linha de ${n(pts[0].v)} em ${dLabel(t0)} até ${n(pts[pts.length-1].v)} em ${dLabel(t1)}">
      ${yt.map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="Roboto Mono, monospace">${n(v)}</text>`).join("")}
      ${xt.map((t,i)=>`<text x="${x(t)}" y="${H-6}" text-anchor="${["start","middle","end"][i]}" font-size="11" fill="var(--muted)">${span < 3*86400000 ? `${ddmm(t)} ${hm(t)}` : dLabel(t)}</text>`).join("")}
      <path d="${d}" fill="none" stroke="var(--c,var(--ink))" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
      ${fmtT==="hora"&&pts.length<=60?pts.map(p=>p.origem?"":`<circle cx="${x(p.t).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="2.5" fill="var(--c,var(--ink))"/>`).join(""):""}
      <line class="cur" x1="0" x2="0" y1="${T-6}" y2="${H-B}" stroke="var(--muted)" stroke-dasharray="3 3" visibility="hidden"/>
      <circle class="cur-dot" r="4.5" fill="var(--c,var(--ink))" stroke="var(--raised)" stroke-width="2" visibility="hidden"/>
    </svg><div class="tip" hidden></div></div>`;
}
function bindCharts(root){
  root.querySelectorAll(".chart").forEach(el=>{
    const c = CHARTS[el.id]; if (!c || c.pts.length<2) return;
    const svg = el.querySelector("svg"), tip = el.querySelector(".tip"), cur = svg.querySelector(".cur"), dot = svg.querySelector(".cur-dot");
    const show = ev => {
      const r = svg.getBoundingClientRect(); const px = (ev.clientX - r.left) * c.W / r.width;
      let best = c.pts[0]; for (const p of c.pts) if (Math.abs(c.x(p.t)-px) < Math.abs(c.x(best.t)-px)) best = p;
      const X = c.x(best.t), Y = c.y(best.v);
      cur.setAttribute("x1",X); cur.setAttribute("x2",X); cur.setAttribute("visibility","visible");
      dot.setAttribute("cx",X); dot.setAttribute("cy",Y); dot.setAttribute("visibility","visible");
      tip.hidden = false; tip.innerHTML = `<b>${n(best.v)}</b>${best.origem?"publicação":(c.fmtT==="dia"?dLabel(best.t):`${dLabel(best.t)}, ${hm(best.t)}`)}`;
      const left = Math.min(Math.max(X*r.width/c.W, 40), r.width-40); tip.style.left = left+"px";
    };
    const hide = () => { tip.hidden = true; cur.setAttribute("visibility","hidden"); dot.setAttribute("visibility","hidden"); };
    svg.addEventListener("pointermove", show); svg.addEventListener("pointerdown", show); svg.addEventListener("pointerleave", hide);
  });
}
function sparkSvg(vals, w=96, h=28){
  if (vals.length < 2) return "";
  const hi = Math.max(...vals) || 1, P=2;
  const xy = vals.map((v,i)=>[P + i*(w-2*P)/(vals.length-1), h-P - v*(h-2*P)/hi]);
  const line = xy.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const last = xy[xy.length-1];
  return `<svg viewBox="0 0 ${w} ${h}" aria-hidden="true"><path d="${line}" fill="none" stroke="var(--c,var(--ink))" stroke-width="1.5" stroke-linejoin="round"/><circle cx="${last[0]}" cy="${last[1]}" r="2.2" fill="var(--c,var(--ink))"/></svg>`;
}

function bars(entries, total){
  const sum = total ?? entries.reduce((s,[,v])=>s+(v||0),0);
  if (!sum) return "";
  return `<dl class="bars">${entries.map(([k,v])=>`<div class="bar"><dt>${esc(k)}<span>${pct(v,sum)}</span></dt><dd><i style="width:${(100*(v||0)/sum).toFixed(1)}%"></i></dd></div>`).join("")}</dl>`;
}
const GEN = {F:"Mulheres", M:"Homens", U:"Não informado"};
function publicoHtml(conta, ig){
  const pub = D.met[conta]?.publico || {};
  let h = "";
  const ps = ig?.insights?.porSeguidor;
  const fv = ps ? [["Seguidores", ps["views:FOLLOWER"] ?? ps["reach:FOLLOWER"]], ["Não seguidores", ps["views:NON_FOLLOWER"] ?? ps["reach:NON_FOLLOWER"]]] : null;
  if (fv && (fv[0][1] || fv[1][1])) h += `<p class="h4">Quem visualizou este post</p>${bars(fv)}`;
  const pa = pub.porSeguidor || {};
  const fa = [["Seguidores", pa["views:FOLLOWER"]], ["Não seguidores", pa["views:NON_FOLLOWER"]]];
  if (fa[0][1] || fa[1][1]) h += `<p class="h4">Quem viu a conta nos últimos 7 dias</p>${bars(fa)}`;
  const demo = (pub.engajados && !pub.engajados.erro && Object.keys(pub.engajados.age||{}).length) ? ["engajados", pub.engajados] : (pub.seguidores && !pub.seguidores.erro && Object.keys(pub.seguidores.age||{}).length) ? ["seguidores", pub.seguidores] : null;
  if (demo){
    const cut = S.dcut || "age";
    const raw = demo[1][cut] || {};
    let ent = Object.entries(raw).map(([k,v])=>[k.split(":").pop(), v]);
    if (cut==="gender") ent = ent.map(([k,v])=>[GEN[k]||k, v]);
    ent.sort((a,b)=> cut==="age" ? a[0].localeCompare(b[0]) : b[1]-a[1]);
    h += `<p class="h4">Detalhes do público da conta</p><p class="section-note">${demo[0]==="engajados"?"Quem interagiu com a conta neste mês":"Quem segue a conta"}. O Instagram não abre esses dados por post.</p>
      <div class="chips" role="group" aria-label="Corte"><button type="button" data-cut="age" aria-pressed="${cut==="age"}">Idade</button><button type="button" data-cut="country" aria-pressed="${cut==="country"}">País</button><button type="button" data-cut="city" aria-pressed="${cut==="city"}">Cidade</button><button type="button" data-cut="gender" aria-pressed="${cut==="gender"}">Gênero</button></div>
      ${bars(ent.slice(0,8)) || `<p class="section-note">Sem dados para este corte.</p>`}`;
  } else {
    h += `<p class="h4">Detalhes do público</p><p class="section-note">Idade, país, cidade e gênero aparecem aqui quando a conta passar de 100 seguidores. Antes disso o Instagram não libera esses dados pela API.</p>`;
  }
  return h || `<p class="section-note">Sem dados de público ainda.</p>`;
}

function cmpHtml(c, isStory){
  if (!c) return "";
  const keys = isStory ? STK : CMPK;
  const linhas = keys.filter(([k])=>c.m[k]).map(([k,l])=>{
    const m = c.m[k], mx = Math.max(m.v, m.base)*1.15 || 1, L = lvlM(m);

  }).join("");
  const head = `<div style="display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap"><p class="h4" style="margin:0">Perto dos anteriores</p>${verdHtml(c)}</div>`;
  if (!linhas) return `<div class="cmp">${head}<p class="section-note">${c.age < HORA ? "Com menos de 1 hora no ar ainda não dá para comparar." : "Faltam posts anteriores com números para comparar."}</p></div>`;
  return `<div class="cmp">${head}<dl class="cmp-list">${linhas}</dl><p class="section-note">Barra: este ${isStory?"story":"post"}. Traço escuro: ${(q=>q===1?(isStory?"o story anterior":"o post anterior "+idadeTxt(c.age)):`média dos ${q} ${isStory?"stories anteriores":"posts anteriores "+idadeTxt(c.age)}`)(Math.max(...Object.values(c.m).map(m=>m.n)))}.</p></div>`;
}

/** Todas as imagens (e vídeos) do post; com uma imagem só, mostra a prévia simples. */
function galHtml(r, t){

  if (!its?.length) return t ? `<img class="big-thumb" src="${esc(t)}" alt="Prévia do post">` : "";

    ? `<video src="${esc(m.video)}"${m.capa?` poster="${esc(m.capa)}"`:""} controls playsinline muted preload="metadata" aria-label="Vídeo ${i+1} de ${k}"></video>`
    : `<img src="${esc(m.img)}" alt="Imagem ${i+1} de ${k}" ${i<2?"":`loading="lazy"`}>`}</figure>`;
  return `<div class="gal" data-gal-id="${esc(r.id)}" data-i="${i0}">
    <div class="gal-track" tabindex="0" aria-label="${k>1?`Carrossel com ${k} itens`:"Mídia do post"}">${its.map(item).join("")}</div>
    ${k>1?`
    <button type="button" class="gal-nav prev" data-gal="-1" aria-label="Imagem anterior"${i0===0?" disabled":""}>‹</button>
    <button type="button" class="gal-nav next" data-gal="1" aria-label="Próxima imagem"${i0===k-1?" disabled":""}>›</button>
    <div class="gal-foot"><div class="gal-dots">${its.map((_,i)=>`<button type="button" data-gal-i="${i}" aria-label="Ir para ${i+1} de ${k}"${i===i0?' aria-current="true"':""}></button>`).join("")}</div><span class="gal-count" aria-live="polite">${i0+1} de ${k}</span></div>`:""}
  </div>`;
}
function bindGal(root){
  root.querySelectorAll(".gal").forEach(g=>{
    const tr = g.querySelector(".gal-track"), k = tr.children.length, id = g.dataset.galId;
    if (k < 2) return;
    const i0 = +g.dataset.i || 0;
    if (i0) { tr.style.scrollBehavior = "auto"; tr.scrollLeft = i0 * tr.clientWidth; tr.style.scrollBehavior = ""; }
    let raf = 0;
    tr.addEventListener("scroll", ()=>{ cancelAnimationFrame(raf); raf = requestAnimationFrame(()=>{
      const i = Math.round(tr.scrollLeft / (tr.clientWidth || 1));
      if (i === +g.dataset.i) return;
      g.dataset.i = i; (S.gal ||= {})[id] = i;
      g.querySelector(".gal-count").textContent = `${i+1} de ${k}`;
      g.querySelectorAll(".gal-dots button").forEach((b,j)=> j===i ? b.setAttribute("aria-current","true") : b.removeAttribute("aria-current"));
      g.querySelector(".prev").disabled = i===0; g.querySelector(".next").disabled = i===k-1;
      tr.querySelectorAll("video").forEach(v=>{ if (!v.paused) v.pause(); });
    }); });
    tr.addEventListener("keydown", e=>{ if (e.key==="ArrowRight"||e.key==="ArrowLeft"){ e.preventDefault(); galGo(g, (+g.dataset.i||0) + (e.key==="ArrowRight"?1:-1)); } });
  });
}
function galGo(g, i){ const tr = g.querySelector(".gal-track"); i = Math.max(0, Math.min(tr.children.length-1, i)); tr.scrollTo({left: i*tr.clientWidth}); }
function closeDetail(){ $("panel").hidden = true; delete $("panel").dataset.id; }

/* ---------- ações ---------- */
async function post(rota, corpo){
  const r = await fetch(rota, {method:"POST", headers:{"Content-Type":"application/json","X-Painel":"1"}, body:JSON.stringify(corpo||{}), credentials:"same-origin"});
  const j = await r.json().catch(()=>({}));
  if (r.status===401) { showLogin(); throw new Error(j.erro || "Entre de novo."); }
  if (!r.ok) throw new Error(j.erro || "Não deu certo agora. Tente de novo em instantes.");
  return j;
}
async function requestPublish(id){
  const p = (D.agenda?.posts||[]).find(x=>x.id===id); if (!p) return;
  confirmId = null; actMsg[id] = {cls:"", text:"Enviando…"}; render(); refreshDetail();
  try {
    await post("/api/publicar", {id});
    actMsg[id] = {cls:"ok", text:"Publicador acionado. O post sai em 1 a 3 minutos."};
    later(90_000); later(240_000);
  } catch(e){ actMsg[id] = {cls:"err", text:e.message}; }
  render(); refreshDetail();
}
async function markPosted(id){
  actMsg[id] = {cls:"", text:"Registrando…"}; render(); refreshDetail();
  try { await post("/api/manual", {id}); actMsg[id] = {cls:"ok", text:"Registrado."}; await load(); }
  catch(e){ actMsg[id] = {cls:"err", text:e.message}; }
  render(); refreshDetail();
}
async function refreshAll(){
  const b = $("b-refresh"); b.disabled = true; $("req").className = "msg"; $("req").textContent = "Checando os tokens e pedindo os números ao Instagram…";
  try { await post("/api/metricas"); $("req").className="msg ok"; $("req").textContent = "Checagem iniciada. A luz e os números novos chegam em cerca de 1 minuto."; later(75_000); }
  catch(e){ $("req").className="msg err"; $("req").textContent = e.message; }
  b.disabled = false;
}
function refreshDetail(){ const id = $("panel").dataset.id; if (id && !$("panel").hidden) openDetail(id); }

/* ---------- render ---------- */
function renderSync(){
  const mt = Object.values(D.met).map(m=>m.coletadoEm).filter(Boolean).sort().pop();
  const parts = [];
  if (D.lidoEm) parts.push(`Agenda lida às ${hm(D.lidoEm)}`);
  if (mt) parts.push(`números de ${ddmmhm(mt)}`);
  $("sync").textContent = parts.length ? parts.join(" · ") : (D.agenda ? "" : "Carregando…");
}
function render(){
  CMP.clear();
  for (const [id,k] of [["fa-pb","pontes_brain"],["fa-gh","GiraHub"],["fa-lp","leopontesrp"]]){
    const ph = D.img["perfil:"+k] || "", el = $(id);
    if (el.dataset.ph !== ph){ el.dataset.ph = ph; el.innerHTML = (ph?`<img src="${esc(ph)}" alt="">`:`<span class="dot ${ACC[k].cls}"></span>`) + esc(ACC[k].label); }
  }
  renderConns();
  document.querySelectorAll("#f-acc button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.v===S.acc));
  document.querySelectorAll("#f-view button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.v===S.view));
  renderSync(); renderAccounts(); bindCharts($("accounts"));
  if (!D.agenda){ $("view").className=""; $("view").innerHTML = `<div class="empty">A fila, o calendário e os números de cada post aparecem aqui assim que os dados do publicador carregarem.</div>`; return; }
  ({fila:renderFila, calendario:renderCal, publicados:renderPub, execucoes:renderExe})[S.view]();
}

document.addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  if (b.closest("#f-acc")) { S.acc=b.dataset.v; save(); render(); return; }
  if (b.closest("#f-view")) { S.view=b.dataset.v; try{ history.replaceState(null,"","#"+S.view); }catch(_){ location.hash=S.view; } render(); return; }
  if (b.id==="b-refresh") { refreshAll(); return; }
  if (b.dataset.conn) { S.acc=b.dataset.conn; save(); render(); document.querySelector(`.acct[data-a="${b.dataset.conn}"]`)?.scrollIntoView({behavior:"smooth", block:"center"}); return; }
  if (b.id==="b-sair") { post("/api/sair").catch(()=>{}).finally(showLogin); return; }
  if (b.id==="prev"||b.id==="next"){ S.m += b.id==="prev"?-1:1; if(S.m<0){S.m=11;S.y--;} if(S.m>11){S.m=0;S.y++;} render(); return; }
  if (b.dataset.day){ S.view="fila"; render(); return; }
  if (b.dataset.ig){ const a=(D.agenda?.posts||[]).find(p=>p.midiaId===b.dataset.ig); openDetail(a ? a.id : "ig:"+b.dataset.ig); return; }
  if (b.dataset.gal){ const g = b.closest(".gal"); galGo(g, (+g.dataset.i||0) + +b.dataset.gal); return; }
  if (b.dataset.galI){ galGo(b.closest(".gal"), +b.dataset.galI); return; }
  if (b.dataset.dtab){ S.dtab=b.dataset.dtab; refreshDetail(); return; }
  if (b.dataset.metric){ S.dmetric=b.dataset.metric; refreshDetail(); return; }
  if (b.dataset.cut){ S.dcut=b.dataset.cut; refreshDetail(); return; }
  if (b.dataset.sort){ const k=b.dataset.sort; S.sort = {k, dir: S.sort.k===k ? -S.sort.dir : -1}; render(); return; }
  if (b.dataset.pub){ confirmId=b.dataset.pub; delete actMsg[confirmId]; render(); refreshDetail(); return; }
  if (b.dataset.go){ requestPublish(b.dataset.go); return; }
  if (b.dataset.cancel){ confirmId=null; render(); refreshDetail(); return; }
  if (b.dataset.mark){ markPosted(b.dataset.mark); return; }
  if (b.dataset.id){ openDetail(b.dataset.id); return; }
  if (b.id==="d-close") closeDetail();
});
document.addEventListener("change", e=>{ if (e.target.id==="sort-sel"){ S.sort = {k:e.target.value, dir:-1}; render(); } });
$("panel").addEventListener("click", e=>{ if(e.target.id==="panel") closeDetail(); });
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && !$("panel").hidden) closeDetail(); });
window.addEventListener("hashchange", ()=>{ fromHash(); render(); });

function showLogin(){ $("app").hidden = true; $("login").hidden = false; $("senha").focus(); }
let timers = [];
function later(ms){ timers.push(setTimeout(()=>load().catch(()=>{}), ms)); }
async function load(){
  const r = await fetch("/api/dados", {credentials:"same-origin", cache:"no-store"});
  if (r.status===401) { showLogin(); return; }
  const j = await r.json().catch(()=>({}));
  if (!r.ok) { $("sync").textContent = j.erro || "Não consegui ler a agenda agora."; return; }
  D.agenda = j.agenda; D.met = j.metricas || {}; D.img = j.imagens || {}; D.gal = j.galeria || {}; D.runs = j.execucoes; D.lidoEm = j.lidoEm;
  $("login").hidden = true; $("app").hidden = false;
  render(); refreshDetail();
  // Link do e-mail de alerta: #post-<id> abre o detalhe do post.
  const h = decodeURIComponent(location.hash.slice(1));
  if (h.startsWith("post-") && $("panel").hidden) {
    const id = h.slice(5);
    if ((D.agenda?.posts||[]).some(p=>p.id===id)) { S.view = "fila"; render(); openDetail(id); }
    try { history.replaceState(null, "", "#"+S.view); } catch(_) {}
  }
}
$("f-login").addEventListener("submit", async e=>{
  e.preventDefault();
  const m = $("login-msg"); m.className = "msg"; m.textContent = "Entrando…";
  try {
    const r = await fetch("/api/entrar", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({senha:$("senha").value}), credentials:"same-origin"});
    if (!r.ok) { const j = await r.json().catch(()=>({})); m.className = "msg err"; m.textContent = j.erro || "Não consegui entrar."; return; }
    $("senha").value = ""; m.textContent = ""; await load();
  } catch(_) { m.className = "msg err"; m.textContent = "Sem conexão. Tente de novo."; }
});
// Enquanto a aba está aberta, relê a agenda a cada 2 minutos.
setInterval(()=>{ if (!document.hidden && !$("app").hidden) load().catch(()=>{}); }, 120_000);
document.addEventListener("visibilitychange", ()=>{ if (!document.hidden && !$("app").hidden) load().catch(()=>{}); });

render();
load().catch(()=>{ $("app").hidden = false; $("sync").textContent = "Sem conexão com o painel."; });
</script>
</body>
</html>
