name: Publicar

# A cada 10 minutos publica o que chegou na hora em instagram/agenda.json (scripts/publicar.mjs)
# e grava o resultado de volta na main (commit "[instagram]", que a Vercel ignora). O botão
# "Publicar agora" do painel dispara este workflow com o id do post.
# Segredos: IG_TOKEN_PONTES_BRAIN, IG_TOKEN_GIRAHUB, IG_TOKEN_LEOPONTESRP, RESEND_API_KEY, ALERTA_EMAIL.
# O GitHub pode atrasar o agendamento alguns minutos em horário de pico.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      post:
        description: "Id de um post para publicar agora (vazio = rodada normal)"
        required: false
      simular:
        description: "Só mostrar o que faria, sem publicar"
        type: boolean
        default: false
      verificar:
        description: "Só conferir os tokens das contas, sem publicar"
        type: boolean
        default: false
      testar_alerta:
        description: "Só mandar um e-mail de alerta de teste, sem publicar"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
            instagram/agenda.json
          sparse-checkout-cone-mode: false

      - name: Publicar o que chegou na hora
        env:
          IG_TOKEN_PONTES_BRAIN: ${{ secrets.IG_TOKEN_PONTES_BRAIN }}
          IG_TOKEN_GIRAHUB: ${{ secrets.IG_TOKEN_GIRAHUB }}
          IG_TOKEN_LEOPONTESRP: ${{ secrets.IG_TOKEN_LEOPONTESRP }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERTA_EMAIL: ${{ secrets.ALERTA_EMAIL }}
          SOMENTE: ${{ inputs.post }}
          SIMULAR: ${{ inputs.simular && '1' || '' }}
          VERIFICAR: ${{ inputs.verificar && '1' || '' }}
          TESTAR_ALERTA: ${{ inputs.testar_alerta && '1' || '' }}
        run: node scripts/publicar.mjs

      - name: Gravar o resultado na agenda
        if: always() && github.ref == 'refs/heads/main'
        run: |
          git diff --quiet -- instagram/agenda.json && exit 0
          git config user.name "insta-report"
          git config user.email "insta-report@users.noreply.github.com"
          git add instagram/agenda.json
          git commit -m "[instagram] atualiza status da agenda"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0; sleep 5; done
          exit 1
